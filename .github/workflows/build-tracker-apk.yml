name: Build Tracker Offline v0.2 APK
on:
  push:
    branches: [tracker-apk-build]
  workflow_dispatch:
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle licensed offline English model
        run: |
          curl --fail --location --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip -o /tmp/vosk-en.zip
          unzip -q /tmp/vosk-en.zip -d tracker-android/app/src/main/assets
          test -s tracker-android/app/src/main/assets/vosk-model-small-en-us-0.15/am/final.mdl
      - name: Assemble signed debug APK
        working-directory: tracker-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TrackerOffline-v0.2-debug-apk
          path: tracker-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
